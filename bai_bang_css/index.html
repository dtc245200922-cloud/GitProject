<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng trong CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Bảng trong CSS</h1>
    <table>
        <thead>
            <tr>
                <th scope="col">Họ tên</th>
                <th scope="col">Tuổi</th>
                <th scope="col">Lớp</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nguyễn Văn A</td>
                <td>20</td>
                <td>Web</td>
            </tr>
            <tr>
                <td>Trần Thị B</td>
                <td>21</td>
                <td>Web</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
