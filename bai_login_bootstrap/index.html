<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-center">
    <form class="form-signin">
        <img class="mb-4" src="bootstrap.svg" alt="Bootstrap logo" width="72" height="72">
        <h1 class="h3 mb-3 fw-normal">Please sign in</h1>
        <label class="visually-hidden" for="inputEmail">Email address</label>
        <input type="email" id="inputEmail" class="form-control" placeholder="Email address" required autofocus autocomplete="username">
        <label class="visually-hidden" for="inputPassword">Password</label>
        <input type="password" id="inputPassword" class="form-control" placeholder="Password" required autocomplete="current-password">
        <div class="checkbox mb-3">
            <label><input type="checkbox" value="remember-me"> Remember me</label>
        </div>
        <button class="btn btn-lg btn-primary w-100" type="submit">Sign in</button>
        <p class="mt-5 mb-3 text-muted">&copy; 2017-2018</p>
        <p id="message" class="small text-muted" role="status" hidden></p>
    </form>
    <script>
        document.querySelector('form').addEventListener('submit', function (event) {
            event.preventDefault();
            const message = document.getElementById('message');
            message.hidden = false;
            message.textContent = 'Demo form only. No authentication server is connected.';
        });
    </script>
</body>
</html>
