<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
        table { width: 100%; max-width: 800px; border-collapse: collapse; }
        th, td { border: 1px solid #888; padding: 12px; text-align: left; }
        th { background-color: #e8eef5; }
    </style>
</head>
<body>
    <h1>Lịch họp công ty</h1>
    <table>
        <tr>
            <th scope="col">Ngày</th>
            <th scope="col">Giờ</th>
            <th scope="col">Nội dung cuộc họp</th>
        </tr>
        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>08:00 - 09:00</td>
            <td>Họp giao ban đầu tuần</td>
        </tr>
        <tr>
            <td>14:00 - 15:00</td>
            <td>Họp nhóm triển khai dự án</td>
        </tr>
        <tr>
            <td>Thứ Ba</td>
            <td colspan="2">08:00 - 12:00: Họp lập kế hoạch kinh doanh (kéo dài 4 giờ)</td>
        </tr>
        <tr>
            <td rowspan="2">Thứ Tư</td>
            <td>09:00 - 10:00</td>
            <td>Họp báo cáo tiến độ</td>
        </tr>
        <tr>
            <td>15:00 - 16:00</td>
            <td>Họp đánh giá kết quả công việc</td>
        </tr>
    </table>
</body>
</html>
